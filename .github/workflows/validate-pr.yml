name: Validate PR & Drafts

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - 'draft/**'

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-build:
    name: Zod Validate, Astro Check & Build
    runs-on: ubuntu-latest

    env:
      ASTRO_TELEMETRY_DISABLED: '1'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate JSON data against Zod schemas
        run: npm run validate-data

      - name: Run Astro & TypeScript checks
        run: npx astro check

      - name: Build site
        run: npm run build
